{{- $_ := required "set signer=<CI signer public key>" .Values.signer -}}
{{- $tls := include "oath.tls" . | fromYaml -}}
apiVersion: v1
kind: Secret
metadata:
  name: oath-webhook-tls
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $tls.ca }}
  tls.crt: {{ $tls.crt }}
  tls.key: {{ $tls.key }}
{{- if and .Values.rpc (not .Values.rpcSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: oath-rpc
  namespace: {{ .Release.Namespace }}
stringData:
  rpc: {{ .Values.rpc | quote }}
{{- end }}
{{- if .Values.registryAuth }}
---
apiVersion: v1
kind: Secret
metadata:
  name: oath-registry-auth
  namespace: {{ .Release.Namespace }}
stringData:
  auth: {{ .Values.registryAuth | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oath-webhook
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: oath-webhook }
  template:
    metadata:
      labels: { app: oath-webhook }
      annotations:
        checksum/tls: {{ $tls.crt | sha256sum }}
        checksum/rpc: {{ .Values.rpc | sha256sum }}
        checksum/registry-auth: {{ .Values.registryAuth | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: webhook
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: OATH_SIGNER, value: {{ .Values.signer | quote }} }
            - { name: OATH_NETWORK, value: {{ .Values.network | quote }} }
            {{- if or .Values.rpc .Values.rpcSecret }}
            - name: SOLANA_RPC
              valueFrom: { secretKeyRef: { name: {{ default "oath-rpc" .Values.rpcSecret }}, key: rpc } }
            {{- end }}
            - { name: OATH_MODE, value: {{ .Values.mode | quote }} }
            - { name: OATH_STALE_OK_HOURS, value: {{ .Values.staleOkHours | quote }} }
            - { name: OATH_PIN, value: "true" }
            - { name: OATH_ALLOWED_REGISTRIES, value: {{ join "," .Values.allowedRegistries | quote }} }
            - { name: OATH_LIMIT, value: {{ .Values.scanLimit | quote }} }
            - { name: OATH_QUORUM, value: {{ .Values.quorum | quote }} }
            - { name: OATH_ATTEST_REPO, value: {{ .Values.attestRepo | quote }} }
            - { name: OATH_PROGRAM, value: {{ .Values.program | quote }} }
            {{- if or .Values.registryAuth .Values.registryAuthSecret }}
            - name: OATH_REGISTRY_AUTH
              valueFrom: { secretKeyRef: { name: {{ default "oath-registry-auth" .Values.registryAuthSecret }}, key: auth } }
            {{- end }}
          ports: [{ containerPort: 8443 }]
          readinessProbe:
            httpGet: { path: /readyz, port: 8443, scheme: HTTPS }
          livenessProbe:
            httpGet: { path: /healthz, port: 8443, scheme: HTTPS }
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
      volumes:
        - name: tls
          secret: { secretName: oath-webhook-tls }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: oath-webhook
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: oath-webhook }
---
apiVersion: v1
kind: Service
metadata:
  name: oath-webhook
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app: oath-webhook }
  ports: [{ port: 443, targetPort: 8443 }]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: oath
webhooks:
  - name: pods.oath.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 15
    failurePolicy: {{ .Values.failurePolicy }}
    reinvocationPolicy: Never
    namespaceSelector:
      matchExpressions:
        - { key: oath.io/exempt, operator: NotIn, values: ["true"] }
        - { key: kubernetes.io/metadata.name, operator: NotIn, values: ["kube-system", "kube-public", "kube-node-lease", {{ .Release.Namespace | quote }}] }
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
    clientConfig:
      service: { name: oath-webhook, namespace: {{ .Release.Namespace }}, path: /validate }
      caBundle: {{ $tls.ca }}
{{- if .Values.networkPolicy }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oath-webhook
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app: oath-webhook }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ port: 8443, protocol: TCP }]
  egress:
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - ports: [{ port: 443, protocol: TCP }]
{{- end }}
