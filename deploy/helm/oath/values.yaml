# Required: public key(s) of the CI signer (comma-separate for rotation)
signer: ""
network: devnet            # devnet | mainnet
rpc: ""                    # overrides the network default (comma-separate for failover); stored in a Secret because RPC URLs often carry an API key
rpcSecret: ""              # or name an existing Secret holding the URL under the key "rpc" (then `rpc` is not needed)
image: ghcr.io/tymofii-thc/oath-webhook:latest   # a published chart ships a DIGEST here (checked by the release job); from a checkout, check it yourself: oath verify --signer <key> --image <ref> --attest Tymofii-thc/oath/release-webhook.yml@refs/heads/main
mode: enforce              # enforce | audit
failurePolicy: Fail        # Fail | Ignore
quorum: 1
attestRepo: ""             # empty = not required. owner/repo accepts any workflow and ref; pin it: owner/repo/deploy.yml@refs/heads/main
program: ""                # experimental account-based backend instead of Memo scanning (README: "On-chain records"); empty = Memo (default)
staleOkHours: 1            # RPC outage: admit digests verified in the last N hours (0 = strict)
replicas: 2
# Private registries, e.g. '{"ghcr.io":{"username":"u","password":"token"}}'. Or reference an existing Secret (key "auth").
registryAuth: ""
registryAuthSecret: ""
# Periodic audit of already-running Pods (cron expression, empty = off). Hourly by default.
auditSchedule: "0 * * * *"
allowedRegistries: []     # registry hosts the webhook may contact, e.g. [ghcr.io, myregistry.azurecr.io]; empty = any host (SSRF surface: set it)
scanLimit: 1000            # transactions scanned per signer (spam on the signer address can push old records out of the window: raise it)
# Restrict the webhook's network: ingress on 8443, egress to DNS and TCP 443 only (RPC + registries). Needs a CNI that enforces NetworkPolicy.
networkPolicy: false
