# oath admission webhook. Install with deploy/install.sh (it generates TLS certs and fills caBundle).
apiVersion: v1
kind: Namespace
metadata:
  name: oath-system
  labels:
    oath.io/exempt: "true"        # the webhook's own namespace is never checked (avoids a bootstrap deadlock)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oath-webhook
  namespace: oath-system
spec:
  replicas: 2
  selector:
    matchLabels: { app: oath-webhook }
  template:
    metadata:
      labels: { app: oath-webhook }
      annotations:
        oath.io/rpc-checksum: "__RPC_SUM__"       # changes with SOLANA_RPC so the Pods restart and pick up the new Secret value
        oath.io/auth-checksum: "__AUTH_SUM__"     # same for OATH_REGISTRY_AUTH
        oath.io/tls-checksum: "__TLS_SUM__"       # install.sh makes a new CA each run: restart the Pods so they serve the certificate the caBundle now trusts
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: webhook
          image: __OATH_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - { name: OATH_SIGNER, value: "__OATH_SIGNER__" }      # comma-separated: list old + new key during rotation
            - { name: OATH_NETWORK, value: "__OATH_NETWORK__" }    # devnet | mainnet
            - name: SOLANA_RPC                                     # overrides the network default (comma-separate for failover). From a Secret: RPC URLs often carry an API key
              valueFrom: { secretKeyRef: { name: oath-rpc, key: rpc, optional: true } }
            - { name: OATH_MODE, value: "__OATH_MODE__" }          # enforce, or audit = allow but warn
            - name: OATH_REGISTRY_AUTH                             # private registries, from the Secret that install.sh creates when OATH_REGISTRY_AUTH is set
              valueFrom: { secretKeyRef: { name: oath-registry-auth, key: auth, optional: true } }
            - { name: OATH_STALE_OK_HOURS, value: "__OATH_STALE_OK_HOURS__" }  # RPC outage: admit digests verified within the last N hours (0 = strictly fail closed)
            - { name: OATH_PIN, value: "true" }                    # rewrite tag -> verified digest
            - { name: OATH_ALLOWED_REGISTRIES, value: "__ALLOWED_REGISTRIES__" }  # comma list of registry hosts the webhook may contact; empty = any host (SSRF surface)
            - { name: OATH_LIMIT, value: "__OATH_LIMIT__" }          # transactions scanned per signer (spam on the signer address can push old records out of the window)
            - { name: OATH_QUORUM, value: "__OATH_QUORUM__" }      # distinct signers that must have anchored the digest (2 = CI key + approver key)
            - { name: OATH_ATTEST_REPO, value: "__OATH_ATTEST_REPO__" }  # owner/repo whose GitHub Actions must have signed a build attestation (empty = not required)
            - { name: OATH_PROGRAM, value: "__OATH_PROGRAM__" }         # experimental account-based backend (README: "On-chain records"); empty = Memo (default)
          ports: [{ containerPort: 8443 }]
          readinessProbe:
            httpGet: { path: /readyz, port: 8443, scheme: HTTPS }
          livenessProbe:
            httpGet: { path: /healthz, port: 8443, scheme: HTTPS }
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
      volumes:
        - name: tls
          secret: { secretName: oath-webhook-tls }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: oath-webhook
  namespace: oath-system
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: oath-webhook }
---
apiVersion: v1
kind: Service
metadata:
  name: oath-webhook
  namespace: oath-system
spec:
  selector: { app: oath-webhook }
  ports: [{ port: 443, targetPort: 8443 }]
---
# Two webhooks on purpose. The verdict is given by a ValidatingWebhook, which sees the Pod AFTER every mutating webhook in the cluster has run
# (sidecar injectors and the like), so nothing can change an image behind its back. The MutatingWebhook only pins tags to digests; it never
# denies, is reinvoked after other mutators, and if it is down the verdict phase still checks the (unpinned) tag.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: oath
webhooks:
  - name: pods.oath.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 15
    failurePolicy: __FAILURE_POLICY__     # Fail = webhook down means pods are NOT admitted (secure default); Ignore = availability over enforcement
    namespaceSelector:
      matchExpressions:
        - { key: oath.io/exempt, operator: NotIn, values: ["true"] }
        - { key: kubernetes.io/metadata.name, operator: NotIn, values: ["kube-system", "kube-public", "kube-node-lease"] }
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
    clientConfig:
      service: { name: oath-webhook, namespace: oath-system, path: /verdict }
      caBundle: __CA_BUNDLE__
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: oath
webhooks:
  - name: pin.oath.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 10
    failurePolicy: Ignore
    reinvocationPolicy: IfNeeded
    namespaceSelector:
      matchExpressions:
        - { key: oath.io/exempt, operator: NotIn, values: ["true"] }
        - { key: kubernetes.io/metadata.name, operator: NotIn, values: ["kube-system", "kube-public", "kube-node-lease"] }
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
    clientConfig:
      service: { name: oath-webhook, namespace: oath-system, path: /pin }
      caBundle: __CA_BUNDLE__
