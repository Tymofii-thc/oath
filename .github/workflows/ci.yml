name: ci

# Tests of oath itself: unit tests, Helm chart lint, and an end-to-end run of the admission webhook in a kind cluster.
on:
  push:
    branches: [main, security-hardening]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: npm ci --omit=optional --ignore-scripts
      - run: npm test
      - name: Helm chart
        run: |
          docker run --rm -v "$PWD/deploy/helm:/c" alpine/helm:3.16.2 lint /c/oath --set signer=X
          docker run --rm -v "$PWD/deploy/helm:/c" alpine/helm:3.16.2 template t /c/oath --set signer=X --set auditSchedule='*/30 * * * *' >/dev/null

  e2e-kind:
    # Uses the Solana devnet RPC (rate-limited on the public endpoint): the RPC client retries 429s with backoff, and
    # SOLANA_RPC can point this at a private endpoint (repo variable, optional) to make the job less dependent on the
    # public endpoint's mood; unset, it falls back to the public devnet default exactly as before.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kind
        run: |
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
      - name: E2E
        # alpine is anchored on devnet by the project's CI key under this digest; nginx:alpine never was.
        env:
          SOLANA_RPC: ${{ vars.SOLANA_RPC }}
        run: OATH_SIGNER=5D4W8x8UeqW3qVi9uzNzvJPWiJZQaRWVR9ru2ckFhoih OK_IMAGE=alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc BAD_IMAGE=nginx:alpine test/e2e-kind.sh

  live-devnet:
    # The forgery regression against the real devnet. Same SOLANA_RPC override as e2e-kind; 429s are retried with backoff either way.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: npm ci --omit=dev --ignore-scripts
      - env:
          SOLANA_RPC: ${{ vars.SOLANA_RPC }}
        run: node test/live-devnet.mjs
      - name: The published webhook image is what install.sh would accept (recorded on Solana, attested by release-webhook on main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNER: ${{ vars.OATH_SIGNER }}
        run: |
          # right after a push :latest can be the new image before release-webhook has attested and recorded it: retry for a few minutes
          for i in 1 2 3 4 5 6 7 8; do
            node bin/oath.mjs verify --signer "$SIGNER" --image ghcr.io/tymofii-thc/oath-webhook:latest --network devnet --rpc "${{ vars.SOLANA_RPC || 'https://api.devnet.solana.com' }}" --attest Tymofii-thc/oath/.github/workflows/release-webhook.yml@refs/heads/main && exit 0
            sleep 45
          done
          exit 1
