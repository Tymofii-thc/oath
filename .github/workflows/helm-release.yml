name: helm-release

# Publishes the Helm chart as an OCI artifact: helm install oath oci://ghcr.io/tymofii-thc/charts/oath --version <v> ...
on:
  workflow_dispatch:
  push:
    tags: ["chart-v*"]

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm lint deploy/helm/oath --set signer=X
          helm package deploy/helm/oath -d out
          helm push out/oath-*.tgz "oci://ghcr.io/${owner}/charts"
