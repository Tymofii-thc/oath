name: release-webhook

# Builds the oath admission-webhook image, attests its build (Sigstore) and anchors its own digest on Solana (oath protects itself).
# deploy/install.sh and the Helm release check exactly these two things before they install or pin the image.
on:
  push:
    branches: [main]
    paths: [Dockerfile, lib/**, bin/**, package.json, .github/workflows/release-webhook.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write       # keyless Sigstore signing of the build attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-webhook" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Anchor digest on Solana
        uses: ./
        with:
          image: ${{ env.IMAGE }}
          digest: ${{ steps.build.outputs.digest }}
          secret-key: ${{ secrets.SOLANA_SECRET_KEY }}
          rpc: ${{ vars.SOLANA_RPC || 'https://api.devnet.solana.com' }}
