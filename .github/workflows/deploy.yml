name: build-anchor-verify-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write       # keyless Sigstore signing of the build attestation
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase image name (GHCR requires it)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./app
          push: true
          tags: ${{ env.IMAGE }}:latest

      # SLSA build provenance: a Sigstore-signed statement (via GitHub OIDC, no long-lived key) that THIS workflow built THIS digest.
      # Verify: gh attestation verify oci://${IMAGE}@<digest> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Optional gate: set repo variable OATH_SCAN=true to refuse to anchor (and therefore deploy) images with fixable CRITICAL vulnerabilities.
      # Optional gate: set repo variable OATH_SCAN=true to refuse to anchor (and therefore deploy) vulnerable images.
      # Tune it with OATH_SCAN_SEVERITY (default CRITICAL; e.g. HIGH,CRITICAL) and OATH_SCAN_INCLUDE_UNFIXED=true (default: only fixable findings count).
      - name: Vulnerability scan (Trivy)
        if: vars.OATH_SCAN == 'true'
        env:
          SEVERITY: ${{ vars.OATH_SCAN_SEVERITY || 'CRITICAL' }}
          INCLUDE_UNFIXED: ${{ vars.OATH_SCAN_INCLUDE_UNFIXED || 'false' }}
        run: |
          args=(--severity "$SEVERITY" --exit-code 1)
          [ "$INCLUDE_UNFIXED" = "true" ] || args+=(--ignore-unfixed)
          docker run --rm -e TRIVY_USERNAME="${{ github.actor }}" -e TRIVY_PASSWORD="${{ secrets.GITHUB_TOKEN }}" \
            aquasec/trivy:0.57.1 image "${args[@]}" "${IMAGE}@${{ steps.build.outputs.digest }}"

      # What is inside the image, as a signed statement: a CycloneDX SBOM generated by Trivy and attested through Sigstore.
      # Verify: gh attestation verify oci://${IMAGE}@<digest> --repo <owner>/<repo> --predicate-type https://cyclonedx.org/bom
      - name: Generate SBOM
        run: |
          docker run --rm -e TRIVY_USERNAME="${{ github.actor }}" -e TRIVY_PASSWORD="${{ secrets.GITHUB_TOKEN }}" -v "$PWD:/out" \
            aquasec/trivy:0.57.1 image --quiet --format cyclonedx --output /out/sbom.cdx.json "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Attest SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      # Dogfooding: this repo uses its own action.
      - name: Anchor digest on Solana
        uses: ./
        with:
          image: ${{ env.IMAGE }}
          digest: ${{ steps.build.outputs.digest }}
          secret-key: ${{ secrets.SOLANA_SECRET_KEY }}
          rpc: ${{ vars.SOLANA_RPC || 'https://api.devnet.solana.com' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase image name (GHCR requires it)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The gate, as a reusable action: pulls the image exactly as prod would, then checks it against Solana
      # and against the Sigstore build attestation. If the image in the registry is not one the pipeline built
      # (e.g. someone pushed to :latest by hand), this fails and the deploy stops.
      - name: Verify image against Solana and the build attestation
        uses: ./verify
        with:
          signer: ${{ vars.OATH_SIGNER }}
          image: ${{ env.IMAGE }}:latest
          rpc: ${{ vars.SOLANA_RPC }}
          attest: ${{ github.repository }}

      - name: Deploy
        run: echo "Image verified. Replace this step with your real deploy (kubectl / ssh / compose)."
