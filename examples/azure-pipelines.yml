# oath in Azure DevOps with Azure Container Registry. Tested on a real pipeline (2026-10-20): record and verify both passed.
# There is no admission webhook for Container Apps, so this verify step is the gate: see README, "Azure DevOps".
# Setup once: `npx --yes oath-verify init`, then a variable group "oath" (Pipelines > Library) with
#   SOLANA_SECRET_KEY  (lock icon = secret): the contents of .oath/ci-key.json
#   OATH_SIGNER        : the public key init printed
#   OATH_REGISTRY_AUTH (lock icon = secret): {"<acr>.azurecr.io":{"username":"<acr user or token name>","password":"<password>"}}
# Secret variables are NOT passed to scripts automatically: each one used below is mapped in `env`.
trigger:
  - master

pool:
  vmImage: ubuntu-latest

variables:
  - group: oath
  - name: image
    value: myregistry.azurecr.io/my-app

steps:
  - task: Docker@2
    displayName: Build and push
    inputs:
      containerRegistry: my-acr-service-connection
      repository: my-app
      command: buildAndPush
      Dockerfile: Dockerfile
      tags: $(Build.BuildId)

  - script: |
      set -e   # without it a failed anchor would not fail this step
      out=$(npx --yes oath-verify@0.5.0 anchor --image $(image):$(Build.BuildId))
      echo "$out"
      echo "##vso[task.setvariable variable=digest]$(echo "$out" | sed -n 's/^Digest  *: //p')"
    displayName: Record the digest on Solana (keeps the digest for the next steps)
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/master')
    env:
      SOLANA_SECRET_KEY: $(SOLANA_SECRET_KEY)
      OATH_REGISTRY_AUTH: $(OATH_REGISTRY_AUTH)

  # Verify and deploy the SAME digest, never the tag: a tag can be moved in the registry between the two steps.
  - script: npx --yes oath-verify@0.5.0 verify --signer $(OATH_SIGNER) --image $(image)@$(digest)
    displayName: Verify before deploy (a non-zero exit stops the pipeline)

  # your deploy goes here, with the same ref: az containerapp update --image $(image)@$(digest) ...
